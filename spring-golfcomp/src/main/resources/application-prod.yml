# Production profile - datasource configured in US-002 (Liquibase)
spring:
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    com.golfcomp: INFO
  file:
    name: /opt/golfcomp/logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
