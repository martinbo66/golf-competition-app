# Development profile - uses H2 in-memory until US-002 adds PostgreSQL/Liquibase
spring:
  datasource:
    url: jdbc:h2:mem:golfcomp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
