spring:
  profiles:
    default: dev
  application:
    name: golfcomp
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: ${GOLFCOMP_DB_URL:jdbc:postgresql://localhost:5432/golfcomp}
    username: ${GOLFCOMP_DB_USERNAME:golfcomp}
    password: ${GOLFCOMP_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

server:
  port: 8080

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%10.10t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  level:
    root: INFO
    com.golfcomp: DEBUG
    org.liquibase: INFO
