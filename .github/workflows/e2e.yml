name: E2E Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vue-golfcomp/package-lock.json

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build app (skip tests)
        run: ./gradlew build -x test

      - name: Install frontend deps and Playwright
        working-directory: vue-golfcomp
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start backend and wait for readiness
        run: |
          java -jar spring-golfcomp/build/libs/*.jar > backend.log 2>&1 &
          echo $! > backend.pid
          npx --yes wait-on http://localhost:8080 -t 90000

      - name: Run Playwright tests
        working-directory: vue-golfcomp
        run: npx playwright test

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: vue-golfcomp/playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: backend-log
          path: backend.log
          retention-days: 14
